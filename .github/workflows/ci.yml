name: AI Foundations CI

on:
  push:
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest

      - run: pytest tests/fast

  evals:
    runs-on: ubuntu-latest

    needs: fast-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python evals/run_eval.py
